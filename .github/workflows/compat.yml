name: compat

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'index.ts'
      - 'configure.ts'
      - 'providers/**'
      - 'stubs/**'
      - 'commands/**'
      - 'bin/test_consumer.ts'
      - 'bin/helpers/consumer/**'
      - 'bin/helpers/consumer_*.ts'
      - '.github/workflows/compat.yml'

permissions:
  contents: read

concurrency:
  group: compat-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  min-peers:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-latest
    env:
      DB_CLIENT: pg
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: package_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: package_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install minimum peers
        run: |
          PEERS=$(node -e '
            const p=require("./package.json"); const dev=p.devDependencies||{};
            for (const [n,r] of Object.entries(p.peerDependencies||{})) {
              if (n==="typescript") continue;
              if (/^https?:/.test(dev[n]||"")) continue;
              process.stdout.write(n+"@"+r.replace(/^[\^~]/,"").split(" ")[0]+" ");
            }')
          pnpm add -D $PEERS
          pnpm list --depth 0 $(echo $PEERS | sed 's/@[^ @]*\( \|$\)/ /g')
      - run: pnpm test
      - run: pnpm build

  latest-peers:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-latest
    env:
      DB_CLIENT: pg
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: package_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: package_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Update latest peers
        run: |
          PEERS=$(node -e '
            const p=require("./package.json"); const dev=p.devDependencies||{};
            for (const [n,r] of Object.entries(p.peerDependencies||{})) {
              if (n==="typescript") continue;
              if (/^https?:/.test(dev[n]||"")) continue;
              process.stdout.write(n+" ");
            }')
          pnpm update $PEERS
      - run: pnpm test
      - run: pnpm build

  consumer:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-latest
    env:
      CONSUMER_EVIDENCE_PATH: ${{ runner.temp }}/consumer-evidence/fresh-sqlite/evidence.json
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm test:consumer
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: consumer-evidence-fresh-sqlite
          path: ${{ runner.temp }}/consumer-evidence/fresh-sqlite/
          if-no-files-found: error

  consumer-sqlite-modes:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [minimum, service-only]
    env:
      CONSUMER_EVIDENCE_PATH: ${{ runner.temp }}/consumer-evidence/${{ matrix.mode }}-sqlite/evidence.json
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - if: matrix.mode == 'minimum'
        run: pnpm test:consumer -- --mode=minimum --compatibility=minimum --database=sqlite
      - if: matrix.mode == 'service-only'
        run: pnpm test:consumer -- --mode=service-only --database=sqlite
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: consumer-evidence-${{ matrix.mode }}-sqlite
          path: ${{ runner.temp }}/consumer-evidence/${{ matrix.mode }}-sqlite/
          if-no-files-found: error

  consumer-postgres:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [fresh, minimum, service-only]
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 55432
      DB_USER: account_kit
      DB_PASSWORD: ''
      DB_DATABASE: account_kit_consumer
      CONSUMER_EVIDENCE_PATH: ${{ runner.temp }}/consumer-evidence/${{ matrix.mode }}-postgres/evidence.json
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prepare native PostgreSQL 16
        run: |
          bin=/usr/lib/postgresql/16/bin
          utilities=(pg_ctl postgres initdb pg_isready psql createdb)
          for utility in "${utilities[@]}"; do
            if [[ ! -x "$bin/$utility" ]]; then
              sudo apt-get update
              sudo apt-get install --no-install-recommends --yes postgresql-16
              break
            fi
          done
          for utility in "${utilities[@]}"; do
            if [[ ! -x "$bin/$utility" ]]; then
              echo "::error::PostgreSQL 16 tool is missing: $bin/$utility"
              exit 1
            fi
          done
          echo "$bin" >> "$GITHUB_PATH"
          version="$("$bin/pg_ctl" --version)"
          printf '%s\n' "$version"
          if [[ "$version" != "pg_ctl (PostgreSQL) 16."* ]]; then
            echo "::error::Expected PostgreSQL 16 tools, got: $version"
            exit 1
          fi
      - name: Start managed PostgreSQL cluster
        id: start_postgres
        run: |
          output="$(pnpm pg:start)"
          printf '%s\n' "$output"
          if [[ "$output" == *"already running on port"* ]]; then
            echo "::error::Refusing to claim an already running PostgreSQL cluster"
            exit 1
          fi
          echo "started=true" >> "$GITHUB_OUTPUT"
      - name: Create dedicated consumer database
        run: createdb -h 127.0.0.1 -p 55432 -U account_kit account_kit_consumer
      - if: matrix.mode == 'fresh'
        run: pnpm test:consumer -- --database=postgres
      - if: matrix.mode == 'minimum'
        run: pnpm test:consumer -- --mode=minimum --compatibility=minimum --database=postgres
      - if: matrix.mode == 'service-only'
        run: pnpm test:consumer -- --mode=service-only --database=postgres
      - name: Stop managed PostgreSQL cluster
        if: ${{ always() && steps.start_postgres.outputs.started == 'true' }}
        run: |
          if ! pnpm pg:stop; then
            echo "::error::Failed to stop this job's managed PostgreSQL cluster"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: consumer-evidence-${{ matrix.mode }}-postgres
          path: ${{ runner.temp }}/consumer-evidence/${{ matrix.mode }}-postgres/
          if-no-files-found: error

  mysql-experimental:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: package_test
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
          MYSQL_USER: postgres
          MYSQL_PASSWORD: postgres
          MYSQL_DATABASE: package_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Grant lock observation access
        run: |
          node --input-type=module <<'JS'
          import mysql from 'mysql2/promise'
          const connection = await mysql.createConnection({
            host: process.env.DB_HOST,
            port: Number(process.env.DB_PORT),
            user: 'root',
            password: 'root',
          })
          try {
            for (const table of ['data_lock_waits', 'threads', 'data_locks']) {
              await connection.query(`GRANT SELECT ON performance_schema.${table} TO 'postgres'@'%'`)
            }
          } finally {
            await connection.end()
          }
          JS
      - run: pnpm test:mysql
