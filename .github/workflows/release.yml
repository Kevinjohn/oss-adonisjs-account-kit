name: release
on:
  workflow_dispatch:
# Only the job that creates the release can write; the checks it calls get read access.
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Refuse other branches before the checks spend their minutes.
  main-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$GITHUB_REF" = "refs/heads/main" || { echo "release runs on main only"; exit 1; }
  checks:
    needs: main-only
    uses: ./.github/workflows/checks.yml
  compat:
    needs: main-only
    uses: ./.github/workflows/compat.yml
  examples:
    needs: main-only
    uses: ./.github/workflows/examples.yml
  # Installing and building run dependency code, so they hold a read-only token.
  package:
    needs: [checks, compat, examples]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.check.outputs.version }}
      tarball: ${{ steps.check.outputs.tarball }}
      sha256: ${{ steps.check.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Release checks (tag, changelog, build, pack)
        id: check
        run: bash bin/release_check.sh
      - name: Test the release archive in a fresh SQLite consumer
        env:
          TARBALL: ${{ steps.check.outputs.tarball }}
          SHA256: ${{ steps.check.outputs.sha256 }}
          CONSUMER_EVIDENCE_PATH: ${{ runner.temp }}/release-consumer/evidence.json
        run: |
          pnpm test:consumer -- --database=sqlite --candidate-tarball="tmp/release/$TARBALL" --candidate-revision="$GITHUB_SHA"
          jq -e --arg sha256 "$SHA256" '.status == "passed" and .candidateSha256 == $sha256' "$CONSUMER_EVIDENCE_PATH"
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: tmp/release/
          if-no-files-found: error
  # Only this job can write, and it runs no repository or dependency code.
  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: release, path: tmp/release }
      - name: Publish and verify release
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
          VERSION: '${{ needs.package.outputs.version }}'
          TARBALL: '${{ needs.package.outputs.tarball }}'
          SHA256: '${{ needs.package.outputs.sha256 }}'
        run: |
          archive="tmp/release/$TARBALL"
          notes=tmp/release/notes.md
          checksum_line=$(printf 'SHA-256: `%s`' "$SHA256")
          printf '%s  %s\n' "$SHA256" "$archive" | sha256sum --check --strict
          grep -Fx -- "$checksum_line" "$notes"

          gh release create "v$VERSION" "$archive" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "$VERSION" --notes-file "$notes"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" |
            jq -e --arg asset "$TARBALL" --arg digest "sha256:$SHA256" --arg checksum_line "$checksum_line" '
              any(.assets[]; .name == $asset and .digest == $digest) and
              (.body | split("\n") | index($checksum_line) != null)
            '
