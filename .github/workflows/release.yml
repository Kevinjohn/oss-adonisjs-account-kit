name: release
on:
  workflow_dispatch:
# Only the job that creates the release can write.
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify CI for the release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "release runs on main only"; exit 1; }
          if ! run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow checks.yml --branch main \
            --event push --commit "$GITHUB_SHA" --limit 1 --json databaseId,headSha |
            jq -er --arg sha "$GITHUB_SHA" '
              .[0] | select(.headSha == $sha)
              | .databaseId | select(type == "number" and . > 0 and floor == .)
            '); then
            echo "::error::No checks.yml push run found for $GITHUB_SHA on main."
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" |
            jq -e '
              .jobs | map(select(.status == "completed" and .conclusion == "success") | .name)
              | index("checks (better-sqlite3)") != null and index("checks (pg)") != null
            '
  # Installing and building run dependency code, so they hold a read-only token.
  package:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.check.outputs.version }}
      tarball: ${{ steps.check.outputs.tarball }}
      sha256: ${{ steps.check.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Release checks (tag, changelog, build, pack)
        id: check
        run: pnpm release
      - name: Test the release archive in a fresh SQLite consumer
        env:
          TARBALL: ${{ steps.check.outputs.tarball }}
          SHA256: ${{ steps.check.outputs.sha256 }}
          CONSUMER_EVIDENCE_PATH: ${{ runner.temp }}/release-consumer/evidence.json
        run: |
          pnpm test:consumer -- --database=sqlite --candidate-tarball="tmp/release/$TARBALL" --candidate-revision="$GITHUB_SHA"
          jq -e --arg sha256 "$SHA256" '.status == "passed" and .candidateSha256 == $sha256' "$CONSUMER_EVIDENCE_PATH"
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: tmp/release/
          if-no-files-found: error
  # Only this job can write, and it runs no repository or dependency code.
  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: release, path: tmp/release }
      - name: Publish and verify release
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
          VERSION: '${{ needs.package.outputs.version }}'
          TARBALL: '${{ needs.package.outputs.tarball }}'
          SHA256: '${{ needs.package.outputs.sha256 }}'
        run: |
          archive="tmp/release/$TARBALL"
          notes=tmp/release/notes.md
          checksum_line=$(printf 'SHA-256: `%s`' "$SHA256")
          printf '%s  %s\n' "$SHA256" "$archive" | sha256sum --check --strict
          grep -Fx -- "$checksum_line" "$notes"

          gh release create "v$VERSION" "$archive" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "$VERSION" --notes-file "$notes"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" |
            jq -e --arg asset "$TARBALL" --arg digest "sha256:$SHA256" --arg checksum_line "$checksum_line" '
              any(.assets[]; .name == $asset and .digest == $digest) and
              (.body | split("\n") | index($checksum_line) != null)
            '
