name: release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Refuse other branches before the checks spend their minutes.
  main-only:
    runs-on: ubuntu-latest
    steps:
      - run: test "$GITHUB_REF" = "refs/heads/main" || { echo "release runs on main only"; exit 1; }
  checks:
    needs: main-only
    uses: ./.github/workflows/checks.yml
  compat:
    needs: main-only
    uses: ./.github/workflows/compat.yml
  examples:
    needs: main-only
    uses: ./.github/workflows/examples.yml
  release:
    needs: [checks, compat, examples]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Release checks (tag, changelog, build, pack)
        run: bash bin/release_check.sh
      - name: Create release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "v$VERSION" "$TARBALL" --prerelease --target "$GITHUB_SHA" --title "$VERSION" --notes-file tmp/release/notes.md
