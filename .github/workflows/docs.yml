name: docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'index.ts'
      - 'configure.ts'
      - 'src/**'
      - 'http/**'
      - 'adapters/**'
      - 'commands/**'
      - 'providers/**'
      - 'services/**'
      - 'testing/**'
      - 'typedoc.json'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      # The README coverage badge reads this file through the shields.io endpoint badge.
      - run: pnpm exec c8 --reporter=json-summary pnpm quick:test
      - name: Coverage badge
        run: |
          mkdir -p docs/.vitepress/dist/badges
          node scripts/coverage_badge.mjs coverage/coverage-summary.json > docs/.vitepress/dist/badges/coverage.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
