name: checks

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/scorecard.yml'
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/scorecard.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # Push and pull request runs start once the repository is public, where hosted minutes are
    # free. Manual and release runs always start.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [better-sqlite3, pg]
    env:
      DB_CLIENT: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: package_test
    services:
      postgres:
        image: ${{ matrix.database == 'pg' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: package_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Formatting, lint, types, build and built-package checks do not depend on the database, so
      # only the SQLite leg runs them. Lint runs once, here: the test and compile steps below skip
      # their `pretest` and `precompile` lint hooks, which `pnpm test` and `pnpm build` still run
      # locally.
      - name: Check formatting
        if: matrix.database == 'better-sqlite3'
        run: pnpm format:check
      - if: matrix.database == 'better-sqlite3'
        run: pnpm lint
      - if: matrix.database == 'better-sqlite3'
        run: pnpm typecheck
      - run: pnpm --config.enable-pre-post-scripts=false test
      - if: matrix.database == 'better-sqlite3'
        run: pnpm --config.enable-pre-post-scripts=false compile
      - if: matrix.database == 'better-sqlite3'
        run: pnpm copy:templates
      - if: matrix.database == 'better-sqlite3'
        run: pnpm test:built-exports
      - if: matrix.database == 'better-sqlite3'
        run: pnpm test:built-setup
