name: checks

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/scorecard.yml'
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/scorecard.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Classifies the change before anything is installed. Two narrow shapes (only the starter
  # workflow's pinned ref, or only the root README) get the `focused` job; everything else, and
  # every manual or release run, gets the full `checks` matrix.
  plan:
    # Push and pull request runs start once the repository is public, where hosted minutes are
    # free. Manual and release runs always start.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
      focused: ${{ steps.classify.outputs.focused }}
      base: ${{ steps.classify.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        env:
          # A release inherits `workflow_dispatch`, so these events never carry a base to diff.
          BASE: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || (github.event_name == 'push' && github.event.before) || '' }}
        run: |
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          node bin/classify_changed.mjs "$BASE"
  checks:
    needs: plan
    if: ${{ needs.plan.outputs.focused != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [better-sqlite3, pg]
    env:
      DB_CLIENT: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: package_test
    services:
      postgres:
        image: ${{ matrix.database == 'pg' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: package_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Formatting, lint, types, build and built-package checks do not depend on the database, so
      # only the SQLite leg runs them.
      - name: Check formatting
        if: matrix.database == 'better-sqlite3'
        run: pnpm format:check
      - if: matrix.database == 'better-sqlite3'
        run: pnpm lint
      - if: matrix.database == 'better-sqlite3'
        run: pnpm typecheck
      - run: pnpm test
      - if: matrix.database == 'better-sqlite3'
        run: pnpm build
      - if: matrix.database == 'better-sqlite3'
        run: pnpm test:built-exports
      - if: matrix.database == 'better-sqlite3'
        run: pnpm test:built-setup
  # The one changed file's formatting and the specs that read it; `pnpm check:changed` plans
  # them from the same classification.
  focused:
    needs: plan
    if: ${{ needs.plan.outputs.focused == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:changed "${{ needs.plan.outputs.base }}"
  # One status to require: green when the plan ran and whichever path it selected passed, or
  # when the private-repository guard skipped the whole run.
  checks-gate:
    needs: [plan, checks, focused]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PLAN: ${{ needs.plan.result }}
      CHECKS: ${{ needs.checks.result }}
      FOCUSED: ${{ needs.focused.result }}
    steps:
      - run: |
          echo "plan=$PLAN checks=$CHECKS focused=$FOCUSED"
          if [ "$PLAN" = skipped ]; then exit 0; fi
          [ "$PLAN" = success ] || { echo "the plan job did not succeed"; exit 1; }
          [ "$CHECKS" = success ] || [ "$FOCUSED" = success ] || { echo "no checks path succeeded"; exit 1; }
