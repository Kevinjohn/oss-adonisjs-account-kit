allowBuilds:
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
minimumReleaseAgeExclude:
  - '@adonisjs/eslint-config@3.1.0'
  - '@adonisjs/vite@6.0.0-next.3'
  - '@adonisjs/assembler@8.5.2'
  - '@adonisjs/core@7.5.2'
  - '@adonisjs/http-server@9.3.1'
  - '@poppinss/utils@7.1.1'
onlyBuiltDependencies:
  - better-sqlite3
# kit:pack creates the vendor tarball the install needs, so scripts must run before the first install.
verifyDepsBeforeRun: false
